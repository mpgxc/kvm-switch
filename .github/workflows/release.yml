# Gera o .dmg (macOS, Apple Silicon), o .deb (Ubuntu, amd64) e o instalador/.exe (Windows x64).
# A cada tag v* (`./release.sh X.Y.Z`) também publica a release. Em pull requests e pelo
# botão "Run workflow" só gera os builds, para conferir que eles saem antes da tag.
name: release

on:
  push:
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: macos/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: target/release/*.dmg

  linux:
    # A glibc mais antiga entre as versões suportadas: as bordas precisam do GNOME 45+,
    # e o 24.04 é o primeiro Ubuntu LTS com ele. O .deb roda no 24.04 e depois.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: |
          sudo apt-get update
          sudo apt-get install -y build-essential dpkg-dev pkg-config libxkbcommon-dev \
            libxkbcommon-x11-dev libxcb1-dev libx11-xcb-dev libwayland-dev \
            libfontconfig-dev libfreetype-dev libvulkan1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: linux/deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: target/release/*.deb

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: choco install innosetup --no-progress -y
      - run: cargo test --locked
      - run: .\windows\build-installer.ps1
      # Os dois .exe na mesma pasta: com caminhos diferentes o artifact guarda as
      # subpastas e o `*.exe` do job release não os encontra.
      - run: Copy-Item target\windows-installer-build\release\kvm-switch.exe target\release\
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: target/release/*.exe

  release:
    needs: [macos, linux, windows]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" *.dmg *.deb *.exe --repo "$GITHUB_REPOSITORY" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
