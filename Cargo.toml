[package]
name = "kvm-switch"
version = "0.4.0"
edition = "2024"
description = "Troca a entrada do monitor e o canal dos periféricos Logitech por atalho"

[dependencies]
anyhow = "1"
async-channel = "2"
dirs = "6"
# runtime_shaders: compila os shaders Metal ao abrir, então não exige o Xcode completo.
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Ícone na barra: NSStatusItem no macOS, StatusNotifierItem por D-Bus no Linux
# (ksni, sem GTK) e área de notificação do Windows.
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
# Decodifica o PNG do ícone na barra.
png = "0.18"
# Cifra (ChaCha20-Poly1305) e nonces aleatórios do quadro da área de transferência;
# já vinha no Cargo.lock pelo cliente HTTP do GPUI.
ring = "0.17"
# A chave da área de transferência aparece e é colada em base64.
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
# Área de transferência (NSPasteboard); já vinham no Cargo.lock pelo GPUI.
objc2 = { version = "0.6", default-features = false }
objc2-foundation = { version = "0.3", default-features = false, features = [
    "NSData",
    "NSDictionary",
    "NSString",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = [
    "NSBitmapImageRep",
    "NSImageRep",
    "NSPasteboard",
] }

[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
global-hotkey = "0.10"

[target.'cfg(target_os = "linux")'.dependencies]
# poll() no hidraw do receptor Logitech.
libc = "0.2"
# A área de transferência pelos métodos D-Bus da extensão do GNOME Shell. Já vem
# pelo tray (ksni) com o runtime `async-io`; aqui só soma a API bloqueante.
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

[target.'cfg(target_os = "windows")'.dependencies]
# DDC/CI pela Windows Monitor Configuration API, sem utilitário externo.
ddc-hi = { version = "0.4", default-features = false, features = ["ddc-winapi"] }
# Acesso aos relatórios HID++ do receptor Bolt pela API HID nativa do Windows.
hidapi = { version = "2", default-features = false, features = ["windows-native"] }
# Teclas pressionadas (seletor), posição do cursor e dos monitores (bordas) e a
# área de transferência.
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }

# Os avisos só viram erro na verificação: `cargo clippy --all-targets -- -D warnings`.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
allow_attributes = "warn"
allow_attributes_without_reason = "warn"
dbg_macro = "warn"
or_fun_call = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"

# O gpui 0.2.2 puxa a xattr 0.2.3 (via zed-async-tar), que não compila no Linux
# com libc >= 0.2.190. vendor/xattr é a 0.2.3 com uma constante corrigida;
# sai daqui quando o gpui deixar de depender dela.
[patch.crates-io]
xattr = { path = "vendor/xattr" }
